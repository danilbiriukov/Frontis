name: CI

# Ветки проверяются через pull_request, push — только для main после слияния.
# Если запускать и по push в любую ветку, каждый коммит в открытом PR
# прогоняется дважды
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint

  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [22, 26]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test

  # Единственная проверка, обязательная для слияния в main (ruleset).
  # Матрицу test можно менять, не трогая правило: оно смотрит только сюда.
  # always() нужен, потому что пропущенная задача считается для GitHub пройденной
  lint-and-tests-passed:
    if: always()
    needs: [lint, test]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Проверить, что lint и все задачи test завершились успешно
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: |
          echo "lint: ${{ needs.lint.result }}, test: ${{ needs.test.result }}"
          exit 1
